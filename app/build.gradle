plugins {
    alias(libs.plugins.android.application)
}

android {
    namespace 'com.eurobuddha.pandadex'
    compileSdk 36

    defaultConfig {
        applicationId "com.eurobuddha.pandadex"
        minSdk 28
        targetSdk 35
        versionCode 415
        versionName "0.4.15"

        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
    }

    buildFeatures {
        buildConfig true   // expose BuildConfig.VERSION_NAME so the footer shows the real build version
    }
    signingConfigs {
        // Minima family release key. Credentials come from ~/.gradle/gradle.properties
        // (outside every repo), so nothing secret is ever committed. On a machine without
        // those props this config stays empty; a release must not silently use a debug key.
        release {
            def ksFile = project.findProperty('MINIMA_FAMILY_RELEASE_STORE_FILE')
            if (ksFile != null) {
                storeFile file(ksFile)
                storePassword project.findProperty('MINIMA_FAMILY_RELEASE_STORE_PASSWORD')
                keyAlias project.findProperty('MINIMA_FAMILY_RELEASE_KEY_ALIAS')
                keyPassword project.findProperty('MINIMA_FAMILY_RELEASE_KEY_PASSWORD')
            }
        }
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
            // Use the dedicated Minima family release key; never substitute debug signing.
            signingConfig signingConfigs.release
        }
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_11
        targetCompatibility JavaVersion.VERSION_11
    }
}

dependencies {

    implementation libs.appcompat
    implementation libs.material
    implementation libs.activity
    implementation libs.constraintlayout

    // Tabbed exchange UI
    implementation 'androidx.viewpager:viewpager:1.0.0'
    // Keep-alive relauncher for GTC renewals / fill alerts while the app is closed
    implementation 'androidx.work:work-runtime:2.9.1'

    // Auditable, bounded Minima SDK sources are compiled from src/main/java/org/minimarex/minimaapi.

    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.json:json:20240303'
}
